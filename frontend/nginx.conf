server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — always fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Simple health endpoint used by Kubernetes probes
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }
}
