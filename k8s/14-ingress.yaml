# NOTE ON SOURCE MATERIAL:
# The original deployment guide pasted this Ingress from a template and left
# `namespace: three-tier` / `name: three-tier-ingress` in place, while every
# verification command later in the same guide checks `ems-ingress` in the
# `ems` namespace. This file uses `ems` / `ems-ingress` to match the rest of
# the implementation and the verification steps that were actually run.
# See docs/deployment-guide.md for details on this inconsistency.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ems-ingress
  namespace: ems
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
