apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ems
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # IMPORTANT: replace with your actual backend image.
          # Docker Hub example: akhileshdevops/employee-management-backend:1.0
          # ECR example: <account-id>.dkr.ecr.ap-south-1.amazonaws.com/employee-management-backend:1.0
          # Do not use the "latest" tag for this project.
          image: YOUR_DOCKERHUB_USERNAME/employee-management-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # ---------- Database configuration ----------
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/ems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ems-secret
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ems-secret
                  key: DB_PASSWORD
            # ---------- JPA / Hibernate ----------
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: ems-backend-config
                  key: DDL_AUTO
            - name: SPRING_JPA_SHOW_SQL
              valueFrom:
                configMapKeyRef:
                  name: ems-backend-config
                  key: SHOW_SQL
            # ---------- Server ----------
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: ems-backend-config
                  key: SERVER_PORT
            # ---------- JWT ----------
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ems-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRATION_MS
              valueFrom:
                configMapKeyRef:
                  name: ems-backend-config
                  key: JWT_EXPIRATION_MS
            # ---------- CORS ----------
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: ems-backend-config
                  key: CORS_ALLOWED_ORIGINS
            # ---------- Logging ----------
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ems-backend-config
                  key: LOG_LEVEL
            - name: SECURITY_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ems-backend-config
                  key: SECURITY_LOG_LEVEL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
