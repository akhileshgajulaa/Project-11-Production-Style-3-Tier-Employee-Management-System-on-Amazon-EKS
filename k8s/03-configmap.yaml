apiVersion: v1
kind: ConfigMap
metadata:
  name: ems-backend-config
  namespace: ems
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "ems_db"
  SERVER_PORT: "8080"
  DDL_AUTO: "update"
  SHOW_SQL: "false"
  DB_POOL_SIZE: "10"
  JWT_EXPIRATION_MS: "86400000"
  CORS_ALLOWED_ORIGINS: "*"
  LOG_LEVEL: "INFO"
  SECURITY_LOG_LEVEL: "WARN"
